{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب قفل شده — سامانه ارتباط با مشتری</title>
    <link rel="stylesheet" href="{% static 'css/font-face.css' %}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Vazir, sans-serif;
            background: linear-gradient(135deg, #0d1b2e 0%, #1a2f4e 50%, #1e3a5f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
        }
        .icon { font-size: 64px; line-height: 1; margin-bottom: 16px; }
        h1 { font-size: 22px; margin-bottom: 12px; }
        p { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.9; }
        .highlight { color: #fcd34d; font-weight: 700; }
        .btn {
            display: inline-block;
            margin-top: 28px;
            padding: 10px 28px;
            background: #1e3a5f;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>حساب کاربری قفل شده است</h1>
        <p>
            به دلیل <span class="highlight">تلاش‌های ناموفق مکرر</span> برای ورود،
            دسترسی به حساب شما به طور موقت مسدود شده است.<br><br>
            لطفاً پس از <span class="highlight">۱۵ دقیقه</span> مجدداً تلاش کنید
            یا با مدیر سیستم تماس بگیرید.
        </p>
        <a href="/accounts/login/" class="btn">بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
