{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
    <li>
        <form method="post" action="{% url 'import_product_catalog' %}" enctype="multipart/form-data"
              style="display:inline-flex;gap:8px;align-items:center;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:6px 10px;">
            {% csrf_token %}
            <span style="font-size:12px;white-space:nowrap;">ایمپورت از اکسل (ستون‌ها: نام کالا، کد کالا، واحد، ضریب):</span>
            <input type="file" name="file" accept=".xlsx,.xls" required style="font-size:12px;">
            <button type="submit" class="button" style="white-space:nowrap;background:#1769aa;color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;">
                آپلود و افزودن
            </button>
        </form>
    </li>
    {{ block.super }}
{% endblock %}
