<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کد تأیید — سامانه ارتباط با مشتری</title>
</head>
<body style="font-family: Arial, sans-serif; direction: rtl; background: #f8fafc; padding: 20px;">
    <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px;
                padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); border-top: 4px solid #0d9488;">
        <h2 style="color: #0f766e; margin: 0 0 16px; font-size: 18px;">🔐 کد تأیید هویت</h2>
        <p style="color: #374151; margin: 0 0 20px; line-height: 1.8;">
            کاربر گرامی <strong>{{ user.get_username }}</strong>،<br>
            کد یک‌بارمصرف ورود به سامانه شما:
        </p>
        <div style="background: #f0fdfa; border: 2px dashed #0d9488; border-radius: 10px;
                    padding: 18px; text-align: center; margin-bottom: 20px;">
            <span style="font-size: 36px; font-weight: 900; letter-spacing: 10px;
                         color: #0f766e; font-family: monospace; direction: ltr;">{{ otp }}</span>
        </div>
        <p style="color: #6b7280; font-size: 13px; margin: 0; line-height: 1.7;">
            ⏱ این کد فقط برای چند دقیقه معتبر است.<br>
            🔒 این کد را با هیچ‌کس به اشتراک نگذارید.<br>
            اگر شما این درخواست را نداده‌اید، حساب خود را بررسی کنید.
        </p>
        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;">
        <p style="color: #9ca3af; font-size: 11px; margin: 0; text-align: center;">
            سامانه ارتباط با مشتری
        </p>
    </div>
</body>
</html>
