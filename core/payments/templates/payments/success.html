<!DOCTYPE html>
{% load static %}
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ثبت موفق</title>
    <link rel="stylesheet" href="{% static 'css/font-face.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-ui.css' %}">
    <style>
        body {
            font-family: Vazir, sans-serif;
            direction: rtl;
            background: #f5f6f8;
            padding: 24px;
        }
        .card {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            padding: 24px;
            text-align: center;
        }
        a, button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        a {
            background: #0d6efd;
            color: #fff;
        }
        button {
            background: #dc3545;
            color: #fff;
        }
        .logout-form {
            margin: 0;
        }
    </style>
</head>
<body>
    {% include "payments/partials/app_navigation.html" %}
    <div class="card">
        <div style="font-size:48px;margin-bottom:12px;">✅</div>
        <h2>واریزی با موفقیت ثبت شد</h2>
        <p style="color:#64748b;font-size:14px;margin:0 0 20px;">اطلاعات واریزی شما دریافت شد و در صف بررسی قرار گرفت.</p>
        <a href="{% url 'submit' %}" class="button-link">بازگشت به داشبورد</a>
        <a href="{% url 'payment_create' %}" class="button-link" style="margin-right:8px;">ثبت واریزی جدید</a>
    </div>
    <script src="{% static 'js/app-ui.js' %}"></script>
</body>
</html>
