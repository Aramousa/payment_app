{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنظیم لوگوی سامانه</title>
    <link rel="stylesheet" href="{% static 'css/font-face.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-ui.css' %}">
    <style>
        body { font-family: Vazir, sans-serif; background: #f3f6fb; margin: 0; }
        .logo-settings-page { max-width: 980px; margin: 0 auto; padding: 20px; }
        .settings-panel { background: #fff; border: 1px solid #dce5f0; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.08); padding: 20px; }
        .settings-title { border: 0; font-size: 20px; margin: 0 0 16px; padding: 0; text-align: right; }
        .logo-preview { align-items: center; background: #172033; border-radius: 8px; display: flex; justify-content: center; min-height: 118px; margin-bottom: 18px; padding: 18px; }
        .logo-preview img { background: #fff; border-radius: 8px; max-height: 86px; max-width: 360px; object-fit: contain; padding: 8px 12px; }
        .rules { background: #eef5ff; border: 1px solid #d8e6f7; border-radius: 8px; color: #24344d; font-size: 13px; line-height: 1.9; margin-bottom: 18px; padding: 12px 14px; }
        .settings-form { display: grid; gap: 14px; }
        .settings-form p { margin: 0; }
        .settings-form label { display: block; font-weight: 900; margin-bottom: 5px; }
        .settings-form input { width: 100%; }
        .settings-actions { display: flex; gap: 10px; justify-content: flex-start; }
        .settings-actions button, .settings-actions a { border: 0; border-radius: 8px; cursor: pointer; font-family: Vazir, sans-serif; font-weight: 900; min-height: 40px; padding: 9px 16px; text-decoration: none; }
        .settings-actions button { background: #1e3a5f; color: #fff; }
        .settings-actions a { background: #e8eef6; color: #26364d; display: inline-flex; align-items: center; }
        .errorlist { color: #b42318; font-size: 13px; font-weight: 800; list-style: none; padding: 0; }
    </style>
</head>
<body>
{% include 'payments/partials/app_navigation.html' %}
<main class="logo-settings-page">
    <section class="settings-panel">
        <h1 class="settings-title">تنظیم لوگوی سامانه</h1>
        <div class="logo-preview">
            <img src="{% if settings_obj.system_logo_url %}{{ settings_obj.system_logo_url }}{% else %}{% static 'logo/logo-top.png' %}{% endif %}" alt="لوگوی فعلی سامانه">
        </div>

        <div class="rules">
            فرمت مجاز: PNG، JPG یا WEBP.
            حجم فایل باید حداکثر 512KB باشد.
            ابعاد لوگو باید حداکثر 600×220 پیکسل و حداقل 120×32 پیکسل باشد.
        </div>

        <form class="settings-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="settings-actions">
                <button type="submit">ذخیره لوگو</button>
                <a href="{% url 'submit' %}">بازگشت</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
