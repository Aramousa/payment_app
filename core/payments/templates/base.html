{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سامانه ارتباط با مشتری{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/font-face.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-ui.css' %}?v=ui-redesign-v17">
    <!-- Bootstrap + jQuery — فایل‌های محلی، بدون نیاز به اینترنت -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.rtl.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/css/bootstrap-icons.min.css' %}">
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <style>
        body { font-family: Vazir, sans-serif; direction: rtl; }
        .container { padding-top: 20px; }
        .btn-success { background-color: #1e3a5f; border-color: #1e3a5f; }
        .btn-success:hover { background-color: #152a45; border-color: #152a45; }
        table th { background: linear-gradient(135deg, #0d1b2e, #1a2f4e); color: #fff; }
        .table-striped > tbody > tr:nth-of-type(odd) > * { background-color: #eef2f8; }
    </style>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/app-redesign.css' %}?v=ui-redesign-v17">
</head>
<body>
    {% include "payments/partials/app_navigation.html" %}
    {% if messages %}
    <div class="container" style="margin-top:8px;">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    <script src="{% static 'js/app-ui.js' %}?v=ui-redesign-v17"></script>
</body>
</html>
